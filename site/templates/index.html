{% extends "base.html" %}
{% set root = "" %}
{% block content %}
<section class="hero">
  <h1>{{ resume.display_name }}</h1>
  {% if resume.pronouns %}<p class="pronouns">{{ resume.pronouns }}</p>{% endif %}
  <p class="headline">{{ resume.headline }}</p>
</section>
<section class="bio">
  <h2>About</h2>
  {{ site.bio_html | safe }}
</section>
{% endblock %}
