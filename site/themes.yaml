# Color themes for the site, in seedpalette's format (https://github.com/kyut0/seedpalette).
# Visitors pick one from the gear menu; the first theme is the default.
#
# Each theme has a light and a dark mode. Required per mode: bg (page background),
# heading (h1/h2 and timeline years), link (links, timeline titles), and accent (buttons,
# tool chips, highlights). Optional: surface (cards), border, text (body), muted
# (secondary text), accent-2 (second accent, decorative), on-accent (button text), plus
# this site's extra tokens below. Anything left out is derived from the colors given.
#
# Text colors that are too faint to read are darkened (light mode) or lightened (dark
# mode) automatically, keeping their hue. Run `make themes` to see every change and
# write a preview of all themes to _site/themes-preview.html.

extra_tokens:
  card-link: {default: link, text: true}  # "Sample work" links on timeline cards
  thumb-bg: {default: "#ffffff"}  # behind project thumbnails

themes:
  ember:
    label: Ember
    description: Cream and dark rust, with pink headings, blue links, and a hot magenta pop.
    light:
      bg: "#f8f1e3"
      surface: "#fffaf0"
      border: "#e6d6b8"
      text: "#3a1a0e"
      muted: "#6e4e3c"
      heading: "#8e1f5c"
      link: "#1f5fae"
      accent: "#ff2d95"
      accent-2: "#e2a400"
      on-accent: "#24120b"
      thumb-bg: "#ffffff"
      card-link: "#0b7285"
    dark:
      bg: "#24120b"
      surface: "#311a10"
      border: "#4d2c1d"
      text: "#f6ead6"
      muted: "#c9ad94"
      heading: "#ff6ec7"
      link: "#86b6ff"
      accent: "#ff2d95"
      accent-2: "#f0bf3a"
      on-accent: "#24120b"
      thumb-bg: "#ffffff"
      card-link: "#4fd8e8"

  sage:
    label: Sage
    description: Pale sage and deep forest, with dark red, neon orange, cyan, and magenta.
    light:
      bg: "#e3eddc"
      text: "#001c07"
      heading: "#700808"
      link: "#059ea1"
      card-link: "#d80aad"
      accent: "#d80aad"
      accent-2: "#ff8800"
    dark:
      bg: "#001c07"
      heading: "#ff8800"
      link: "#00f7ff"
      card-link: "#059ea1"
      accent: "#d80aad"
      accent-2: "#ff8800"

  # Imported from Omarchy (MIT license, https://github.com/omacom/omarchy) at commit
  # 7cc6a55f24fa with `seedpalette import-omarchy NAME --ref 7cc6a55f24fa`. Each is one
  # mode in Omarchy; the other mode is derived. Re-run that command to refresh them.

  tokyo-night:
    label: Tokyo Night
    description: "Imported from Omarchy: tokyo-night (dark), light mode derived."
    light:
      bg: "#f3f4ff"
      surface: "#fbfcff"
      border: "#d1d7ec"
      text: "#1d2030"
      muted: "#505466"
      heading: "#ad8ee6"
      link: "#7aa2f7"
      accent: "#7aa2f7"
      accent-2: "#e0af68"
    dark:
      bg: "#1a1b26"
      surface: "#24283b"
      border: "#292e42"
      text: "#a9b1d6"
      muted: "#565f89"
      heading: "#ad8ee6"
      link: "#7aa2f7"
      accent: "#7aa2f7"
      accent-2: "#e0af68"

  # Rose Pine's light mode is Omarchy's import above. Omarchy only ships the light
  # (dawn) variant, so the dark mode uses the official Rose Pine "main" palette instead
  # (MIT license, https://github.com/rose-pine/rose-pine-palette), mapped to the same
  # roles: base, surface, overlay, text, muted, iris, foam, gold.
  rose-pine:
    label: Rose Pine
    description: "Light mode imported from Omarchy (rose-pine); dark mode is Rose Pine's official main palette."
    light:
      bg: "#faf4ed"
      surface: "#f2e9e1"
      border: "#dfdad9"
      text: "#575279"
      muted: "#9893a5"
      heading: "#907aa9"
      link: "#56949f"
      accent: "#56949f"
      accent-2: "#ea9d34"
    dark:
      bg: "#191724"
      surface: "#1f1d2e"
      border: "#26233a"
      text: "#e0def4"
      muted: "#6e6a86"
      heading: "#c4a7e7"
      link: "#9ccfd8"
      accent: "#9ccfd8"
      accent-2: "#f6c177"
