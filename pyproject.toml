[project]
name = "portfolio"
version = "0.1.0"
description = "Resume-as-code: validated YAML/Markdown content rendered to a static site and deployed to GitHub Pages."
authors = [
    { name = "Katy Yut" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic (>=2.9,<3.0)",
    "pyyaml (>=6.0,<7.0)",
    "jinja2 (>=3.1,<4.0)",
    "markdown-it-py (>=3.0,<4.0)",
    "typst (>=0.15.0,<0.16.0)",
]

[project.scripts]
portfolio = "portfolio.cli:main"

[dependency-groups]
dev = [
    "pytest (>=8.3,<9.0)",
    "pytest-cov (>=6.0,<7.0)",
    "ruff (>=0.8,<1.0)",
    "mypy (>=1.13,<2.0)",
    "types-pyyaml (>=6.0,<7.0)",
    "pre-commit (>=4.0,<5.0)",
    "pypdf (>=6.19.0,<7.0.0)",
]

[tool.poetry]
packages = [{ include = "portfolio", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["–"]  # en dash in date ranges is intentional

[tool.ruff.lint.isort]
known-first-party = ["portfolio"]
force-sort-within-sections = true

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
